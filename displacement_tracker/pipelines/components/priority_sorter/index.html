<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
:root{--background:#fff;--secondary-background:#f0f2f6;--text:#31333f;--border:rgba(49,51,63,.15)}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:14px "Source Sans Pro",sans-serif}
#items{display:grid;gap:.25rem}.row{align-items:center;background:var(--secondary-background);border:1px solid var(--border);border-radius:.25rem;cursor:grab;display:grid;grid-template-columns:1.5rem 1fr;min-height:2.25rem;padding:.35rem .55rem;user-select:none}.row:active{cursor:grabbing}.row.dragging{opacity:.45}.row.over{outline:2px solid var(--text);outline-offset:1px}.handle{opacity:.55;font-size:1.1rem;letter-spacing:-2px}.label{overflow-wrap:anywhere}
</style></head><body><div id="items"></div><script>
const list=document.getElementById("items");let items=[],draggedIndex=null;
function send(type,data){window.parent.postMessage({isStreamlitMessage:true,type,...data},"*")}
function setHeight(){send("streamlit:setFrameHeight",{height:document.body.scrollHeight})}
function render(){list.replaceChildren();items.forEach((name,index)=>{const row=document.createElement("div");row.className="row";row.draggable=true;row.innerHTML='<span class="handle">⠿</span><span class="label"></span>';row.querySelector(".label").textContent=name;row.addEventListener("dragstart",()=>{draggedIndex=index;row.classList.add("dragging")});row.addEventListener("dragend",()=>{draggedIndex=null;row.classList.remove("dragging");document.querySelectorAll(".over").forEach(el=>el.classList.remove("over"))});row.addEventListener("dragover",event=>{event.preventDefault();row.classList.add("over")});row.addEventListener("dragleave",()=>row.classList.remove("over"));row.addEventListener("drop",event=>{event.preventDefault();row.classList.remove("over");if(draggedIndex===null||draggedIndex===index)return;const[moved]=items.splice(draggedIndex,1);items.splice(index,0,moved);render();send("streamlit:setComponentValue",{value:items,dataType:"json"})});list.appendChild(row)});setHeight()}
window.addEventListener("message",event=>{if(event.data.type!=="streamlit:render")return;const theme=event.data.theme||{};document.documentElement.style.setProperty("--background",theme.backgroundColor||"#fff");document.documentElement.style.setProperty("--secondary-background",theme.secondaryBackgroundColor||"#f0f2f6");document.documentElement.style.setProperty("--text",theme.textColor||"#31333f");document.documentElement.style.setProperty("--border",`${theme.textColor||"#31333f"}26`);items=Array.isArray(event.data.args?.items)?[...event.data.args.items]:[];render()});send("streamlit:componentReady",{apiVersion:1});
</script></body></html>
